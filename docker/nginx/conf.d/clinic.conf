upstream frontend_upstream {
    server clinic_frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server clinic_backend:4000;
    keepalive 32;
}

# Rate limit zones for API abuse and DDoS protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

# HTTP -> HTTPS redirect (production)
server {
    listen 80;
    listen [::]:80;
    server_name clinicos.app *.clinicos.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server - Wildcard Subdomains & Apex Domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ~^(?<tenant_slug>[a-zA-Z0-9-]+)\.clinicos\.app$ clinicos.app www.clinicos.app;

    # SSL certificates (Wildcard certificate covers *.clinicos.app and clinicos.app)
    ssl_certificate /etc/letsencrypt/live/clinicos.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicos.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Client body size for clinical file & lab photo uploads (up to 20MB)
    client_max_body_size 20M;

    # Backend API routing
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Next.js SSR / Static Routing
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
