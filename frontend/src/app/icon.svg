<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" width="120" height="120">
  <defs>
    <!-- Deep Heritage Medical Teal Gradient -->
    <linearGradient id="kpBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#021C19" />
      <stop offset="45%" stopColor="#063D36" />
      <stop offset="100%" stopColor="#011412" />
    </linearGradient>

    <!-- Outer Chamfer Bevel Glow -->
    <linearGradient id="kpBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2DD4BF" stopOpacity="0.6" />
      <stop offset="50%" stopColor="#10B981" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#047857" stopOpacity="0.5" />
    </linearGradient>

    <!-- K Pillar & Cross Stem Gradient -->
    <linearGradient id="kpPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#14B8A6" />
      <stop offset="50%" stopColor="#0D9488" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>

    <!-- Upper K Diagonal Arm Gradient (Upward Momentum) -->
    <linearGradient id="kpArmUpper" x1="20%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="50%" stopColor="#2DD4BF" />
      <stop offset="100%" stopColor="#5EEAD4" />
    </linearGradient>

    <!-- Lower K Diagonal Leg Gradient (Firm Grounding) -->
    <linearGradient id="kpArmLower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0D9488" />
      <stop offset="70%" stopColor="#065F46" />
      <stop offset="100%" stopColor="#022C22" />
    </linearGradient>

    <!-- Luminous Surgical White Medical Cross Core -->
    <linearGradient id="kpSurgicalCross" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#F0FDF4" />
    </linearGradient>

    <!-- Vital Pulse (EKG) Glow -->
    <linearGradient id="kpPulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#059669" />
      <stop offset="35%" stopColor="#0F766E" />
      <stop offset="50%" stopColor="#14B8A6" />
      <stop offset="70%" stopColor="#0F766E" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>

    <!-- Ambient Core Backlight -->
    <radialGradient id="kpBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#10B981" stopOpacity="0.32" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow for Core Emblem -->
    <filter id="kpEmblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Clean Core White Glow -->
    <filter id="kpCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#34D399" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Base Shadow Plate -->
  <rect x="6" y="8" width="108" height="108" rx="28" fill="#010D0C" opacity="0.65" />

  <!-- 2. Human-Crafted Squircle Container Chassis -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#kpBaseGrad)" />
  <circle cx="60" cy="60" r="46" fill="url(#kpBacklight)" />
  <rect x="7.5" y="7.5" width="105" height="105" rx="26.5" stroke="url(#kpBevelGrad)" stroke-width="1.5" />

  <!-- 3. Architect Grid Precision Corner Crosshairs (Human Draft Marks) -->
  <line x1="16" y1="22" x2="22" y2="22" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35" />
  <line x1="22" y1="16" x2="22" y2="22" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35" />
  <line x1="104" y1="22" x2="98" y2="22" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35" />
  <line x1="98" y1="16" x2="98" y2="22" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35" />
  <line x1="16" y1="98" x2="22" y2="98" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35" />
  <line x1="22" y1="104" x2="22" y2="98" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35" />
  <line x1="104" y1="98" x2="98" y2="98" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35" />
  <line x1="98" y1="104" x2="98" y2="98" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- 4. OFFICIAL KRUPET CAPITAL "K" MONOGRAM -->
  <g filter="url(#kpEmblemShadow)">
    <!-- (A) Vertical Pillar Stem of K -->
    <rect x="28" y="26" width="16" height="68" rx="4.5" fill="url(#kpPillarGrad)" />
    <!-- Subtle Spine Edge Highlight -->
    <line x1="31" y1="29" x2="31" y2="91" stroke="#5EEAD4" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- (B) Upper Diagonal Arm of K (Reaching up to 88, 26) -->
    <path d="M 42 56 L 72 26 L 90 26 L 56 66 Z" fill="url(#kpArmUpper)" />
    <!-- Upper Arm Bevel Glint -->
    <line x1="45" y1="54" x2="88" y2="28" stroke="#A7F3D0" stroke-width="1.4" stroke-opacity="0.6" />

    <!-- (C) Lower Diagonal Leg of K (Grounding firmly down to 90, 94) -->
    <path d="M 48 58 L 72 94 L 92 94 L 62 50 Z" fill="url(#kpArmLower)" />
    <!-- Lower Leg Inner Accent -->
    <line x1="51" y1="61" x2="88" y2="92" stroke="#2DD4BF" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- (D) Integral Healthcare Motif: Embedded Surgical Medical Cross (+) -->
    <!-- Horizontal Cross Bar bridging left of stem through center junction -->
    <rect x="16" y="52" width="40" height="16" rx="4" fill="url(#kpPillarGrad)" />
    <!-- Vertical Cross Overlap Core -->
    <rect x="28" y="44" width="16" height="32" rx="4" fill="url(#kpPillarGrad)" />

    <!-- (E) Luminous Surgical White Medical Cross Inset Core -->
    <rect x="19" y="55" width="34" height="10" rx="2.5" fill="url(#kpSurgicalCross)" filter="url(#kpCoreGlow)" />
    <rect x="31" y="47" width="10" height="26" rx="2.5" fill="url(#kpSurgicalCross)" filter="url(#kpCoreGlow)" />

    <!-- (F) Precision Cardiogram Pulse Wave (Heartbeat through the cross) -->
    <path
      d="M 18 60 L 25 60 L 29 52 L 34 68 L 38 54 L 42 60 L 52 60"
      stroke="url(#kpPulseLine)"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- (G) Luminous Vital Spark Center Node -->
    <circle cx="34" cy="68" r="2.8" fill="#FFFFFF" filter="url(#kpCoreGlow)" />
    <circle cx="34" cy="68" r="1.4" fill="#059669" />

    <!-- (H) Apex Diamond Beacon at Upper K Tip (Photoshop Artisan Accent) -->
    <polygon points="86,22 88,26 92,26 89,29 90,33 86,30 82,33 83,29 80,26 84,26" fill="#FDE68A" filter="url(#kpCoreGlow)" opacity="0.85" />
  </g>
</svg>