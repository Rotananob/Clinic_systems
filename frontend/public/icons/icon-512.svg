  />

  <!-- 4. Center Optical Aperture Point -->
  <circle cx="256" cy="214" r="17" fill="#031c19" />

  <!-- 5. Minimalist Gen-Z Vitality Spark -->
  <circle cx="256" cy="410" r="11" fill="#34d399" />
