<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <defs>
    <linearGradient id="genzBaseGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#031c19" />
      <stop offset="100%" stopColor="#063f39" />
    </linearGradient>
    <linearGradient id="genzMintGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="genzAccentSpark512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6ee7b7" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
  </defs>

  <!-- Human-Crafted Modern Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#genzBaseGrad512)" />
  <rect x="6" y="6" width="500" height="500" rx="122" stroke="#10b981" stroke-width="6" stroke-opacity="0.22" />

  <!-- Gen-Z Minimalist Monogram: Interlocking 'H' + 'V' Kinetic Medical Plus -->
  <!-- 1. Dynamic 'V' Foundation with curved apex -->
  <path
    d="M154 136V256C154 312.3 199.7 358 256 358C312.3 358 358 312.3 358 256V136"
    stroke="url(#genzMintGrad512)"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 2. Precision Crossbar forming the 'H' and horizontal beam of '+' -->
  <line
    x1="94"
    y1="214"
    x2="418"
    y2="214"
    stroke="#ffffff"
    stroke-width="42"
    stroke-linecap="round"
  />

  <!-- 3. Vertical Health Pillar completing the '+' beacon -->
  <line
    x1="256"
    y1="94"
    x2="256"
    y2="214"
