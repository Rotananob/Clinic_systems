<svg viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg" width="192" height="192">
  <defs>
    <linearGradient id="genzBaseGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#031c19" />
      <stop offset="100%" stopColor="#063f39" />
    </linearGradient>
    <linearGradient id="genzMintGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="genzAccentSpark192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6ee7b7" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
  </defs>

  <!-- Human-Crafted Modern Squircle Container -->
  <rect width="192" height="192" rx="48" fill="url(#genzBaseGrad192)" />
  <rect x="2.5" y="2.5" width="187" height="187" rx="45.5" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.22" />

  <!-- Gen-Z Minimalist Monogram: Interlocking 'H' + 'V' Kinetic Medical Plus -->
  <!-- 1. Dynamic 'V' Foundation with curved apex -->
  <path
    d="M58 51V96C58 117.2 75.1 134.4 96 134.4C117.2 134.4 134.4 117.2 134.4 96V51"
    stroke="url(#genzMintGrad192)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 2. Precision Crossbar forming the 'H' and horizontal beam of '+' -->
  <line
    x1="35"
    y1="80"
    x2="157"
    y2="80"
    stroke="#ffffff"
    stroke-width="16"
    stroke-linecap="round"
  />

  <!-- 3. Vertical Health Pillar completing the '+' beacon -->
